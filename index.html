<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Examen simulacro de práctica para bomberos.">
  <title>Examen simulacro CB</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="line3">EXAMEN SIMULACRO CB (<span id="exam-count">40</span> preguntas)</div>
  </header>
  <main>
    <section class="container">
      <div class="card">
        <p id="status" role="status" aria-live="polite">Cargando preguntas…</p>
        <form id="cuestionario" autocomplete="off" hidden>
          <div id="questions-list"></div>
          <div class="actions">
            <button type="submit" id="guardar">ENVIAR EXAMEN</button>
            <button type="button" id="reiniciar" hidden>OTRO EXAMEN</button>
          </div>
        </form>
        <section id="resultado" class="resultado" aria-live="polite" hidden></section>
      </div>
    </section>
  </main>
  <footer class="signature">powered by decibelius</footer>
</body>
</html>
